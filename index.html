<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#ffe9f2" />
  <title>吳 · 泡泡取名機</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="stage"></div>

  <div id="ui">
    <!-- 頂欄：標題 + 取名能量瓶 -->
    <header id="topbar">
      <div id="brand">
        <span class="surname-chip">吳</span>
        <span id="brandText">泡泡取名機</span>
      </div>
      <div id="energy" title="取名能量">
        <div id="energyFill"><span id="energyLabel">0</span></div>
      </div>
    </header>

    <!-- 中間：組合中的名字（吳 ＋ 收集到的字） -->
    <div id="workline">
      <span class="slot surname">吳</span>
      <span class="slot empty" id="slot1">?</span>
      <span class="slot empty" id="slot2">?</span>
    </div>

    <!-- 喜用神（父母可選想補的五行，也可自動） -->
    <div id="wxbar">
      <span class="wx-label">喜用</span>
      <button type="button" class="wx-chip auto active" data-w="auto">自動</button>
      <button type="button" class="wx-chip" data-w="金">金</button>
      <button type="button" class="wx-chip" data-w="木">木</button>
      <button type="button" class="wx-chip" data-w="水">水</button>
      <button type="button" class="wx-chip" data-w="火">火</button>
      <button type="button" class="wx-chip" data-w="土">土</button>
    </div>

    <!-- 取名揭曉 -->
    <div id="reveal" class="hidden">
      <div class="card">
        <div id="revealName"></div>
        <div id="revealTag"></div>
        <div class="hint">再摸一摸，取下一個名字！</div>
      </div>
    </div>

    <!-- 底部：名字簿 -->
    <button id="bookToggle" type="button">名字簿 <span id="bookCount">0</span></button>
    <section id="book" class="hidden"></section>

    <div id="footerHint">摸一摸、滑一滑，能量滿了就取名！點中泡泡可收集好字</div>
  </div>

  <script src="js/namepool.js"></script>
  <script type="module" src="js/game.js"></script>
</body>
</html>
