<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f2e9d8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="吳・古本取名：依古本易經、古本紫微斗數、古本山海經、古本神農本草取名。喜用神只有木、火，木為喜用、火為次用。"
    />
    <title>吳・古本取名 · 木火為喜用</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="desk" aria-hidden="true">
      <i class="grain"></i>
    </div>

    <main class="scroll-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-seal" aria-hidden="true">吳</span>
          <span class="brand-text">
            <b>古本取名</b>
            <small id="brandSub">卜筮 · 星曜 · 山海 · 本草 · 道樸</small>
          </span>
        </div>
        <nav id="tools" aria-label="設定">
          <button id="effectsToggle" class="round" type="button" aria-pressed="true">
            <b aria-hidden="true">♪</b><span>音效</span>
          </button>
          <button id="musicToggle" class="round" type="button" aria-pressed="true">
            <b aria-hidden="true">♫</b><span>音樂</span>
          </button>
          <button
            id="fullscreenToggle"
            class="round"
            type="button"
            aria-label="進入全螢幕"
          >
            <b aria-hidden="true">⛶</b><span>全螢幕</span>
          </button>
        </nav>
      </header>

      <aside class="rail rail-left">
        <section class="panel">
          <h2 class="panel-title" id="booksTitle">古本</h2>
          <div id="books" class="book-tabs" role="group" aria-label="選擇古本"></div>
          <p id="bookBlurb" class="panel-note"></p>
        </section>

        <section class="panel">
          <h2 class="panel-title">喜用神</h2>
          <p class="panel-note keep">
            原局木弱，火有而不得令。木為喜用、火為次用 —— 喜木，不狂補火。
          </p>
          <div id="wxbar" class="wxbar" role="group" aria-label="喜用神">
            <button type="button" data-w="auto" aria-pressed="true">
              <b>木火</b><small>七三之序</small>
            </button>
            <button type="button" data-w="木" aria-pressed="false">
              <b>木</b><small>喜用 · 首選</small>
            </button>
            <button type="button" data-w="火" aria-pressed="false">
              <b>火</b><small>次用 · 輔助</small>
            </button>
          </div>
        </section>

        <section class="panel name-panel">
          <h2 class="panel-title">所收之字</h2>
          <div id="workline" class="workline" aria-live="polite">
            <span class="slot surname">吳</span>
            <span class="slot empty" id="slot0">？</span>
            <span class="slot empty" id="slot1">？</span>
          </div>
          <div id="slotNotes" class="slot-notes"></div>
        </section>

        <button id="bookToggle" class="book-button" type="button">
          <span class="book-icon" aria-hidden="true">函</span>
          <span class="book-label"
            >名錄<small>收藏每一次成卦</small></span
          >
          <span id="bookCount">0</span>
          <span aria-hidden="true">›</span>
        </button>

        <p id="poolNote" class="pool-note"></p>
      </aside>

      <section class="stage-wrap" aria-label="六爻成卦">
        <div class="stage-head">
          <span id="castLabel" class="cast-label">爻 0 / 6</span>
          <span id="stageBook" class="stage-book">古本易經</span>
        </div>

        <div id="stage" class="stage">
          <div class="paper-grain" aria-hidden="true"></div>
          <div id="hexagram" class="hexagram" role="img" aria-label="卦盤"></div>

          <div class="scroll-text">
            <div class="scroll-head">
              <span id="panelSeal" class="panel-seal" aria-hidden="true">易</span>
              <div>
                <h2 id="panelTitle">靜待起卦</h2>
                <p id="panelWx" class="panel-wx"></p>
              </div>
            </div>
            <dl id="panelBody" class="panel-body"></dl>
          </div>

          <p id="castHint" class="cast-hint">點一下卦盤，擲下第一爻。</p>
        </div>

        <div class="stage-foot">
          <div
            id="energy"
            class="energy"
            role="progressbar"
            aria-label="成卦進度"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <div class="energy-heading">
              <span>成卦進度</span><span id="energyLabel">0%</span>
            </div>
            <div class="energy-track"><div id="energyFill"></div></div>
          </div>
          <button id="castButton" class="cast-button" type="button">
            擲爻
          </button>
        </div>
      </section>
    </main>

    <div id="effects" aria-hidden="true"></div>
    <div id="toast" class="hidden" role="status"></div>

    <section id="book" class="hidden" aria-label="名錄">
      <div class="book-panel">
        <button class="close" id="bookClose" type="button" aria-label="關閉名錄">×</button>
        <h2>名錄</h2>
        <p>每一次成卦，都留一個名字。</p>
        <div id="bookActions" class="book-actions hidden">
          <button id="copyAll" type="button" class="book-action">複製全部</button>
          <button id="copyNames" type="button" class="book-action">只複製名字</button>
          <button id="copyDetail" type="button" class="book-action">複製含出處</button>
        </div>
        <div id="bookList"></div>
      </div>
    </section>

    <div id="reveal" class="hidden">
      <div class="reveal-card">
        <span class="reveal-seal" aria-hidden="true">名</span>
        <p id="revealSource" class="reveal-source"></p>
        <div id="revealName" class="reveal-name" aria-live="polite"></div>
        <div id="revealTag" class="reveal-tag"></div>
        <ul id="revealMeaning" class="reveal-meaning"></ul>
        <span class="saved-badge">✓ 已收入名錄</span>
        <p class="reveal-hint">繼續擲爻，也能再得一名</p>
      </div>
    </div>

    <script type="module" src="js/game.js"></script>
  </body>
</html>
